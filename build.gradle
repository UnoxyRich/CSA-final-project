plugins {
    id 'application'
    id 'java'
}

repositories { mavenCentral() }

def lwjglVersion = '3.3.3'
def jomlVersion  = '1.10.5'

def osName = System.getProperty('os.name').toLowerCase()
def arch = System.getProperty('os.arch')
def isMac = osName.contains('mac') || osName.contains('darwin')
def isLinux = osName.contains('linux')
def lwjglNatives
if (isMac) {
    lwjglNatives = arch.startsWith('aarch64') ? 'natives-macos-arm64' : 'natives-macos'
} else if (isLinux) {
    lwjglNatives = arch.startsWith('aarch64') ? 'natives-linux-arm64' : 'natives-linux'
} else {
    lwjglNatives = 'natives-windows'
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.lwjgl:lwjgl-stb'
    runtimeOnly  "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly  "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly  "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    runtimeOnly  "org.lwjgl:lwjgl-stb::$lwjglNatives"
    implementation "org.joml:joml:$jomlVersion"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.csa.minecraft.Main'
    applicationDefaultJvmArgs = isMac ? ['-XstartOnFirstThread'] : []
}

java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
}
